<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CarService - Web Service Tester</title>
<link rel="stylesheet" href="/css/ws-tester.css"/>
</head>
<body>

<header>
  <img src="/images/parts/logo.png" alt="CarService" class="header-logo"/>
  <div>
    <h1>Web Service Tester</h1>
    <div class="sub">REST API · JSON · Bearer Token Auth</div>
  </div>
</header>

<div class="wrap">

  <!-- Login per token -->
  <div class="card card-login">
    <h2>Hyr per te marre Token</h2>
    <div class="form-row">
      <div>
        <label>Email</label>
        <input type="email" id="login-email" value="sin.my@gmail.com"/>
      </div>
      <div>
        <label>Fjalekalimi</label>
        <input type="password" id="login-pass" value="200400"/>
      </div>
    </div>
    <button class="btn btn-login" onclick="doLogin()">Hyr &amp; Merr Token</button>
    <div id="login-msg" class="login-msg"></div>
  </div>

  <!-- API Key -->
  <div class="apikey-box">
    <p><strong>API Key (JWT Token)</strong></p>
    <input type="text" id="apikey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."/>
    <div id="status-bar"></div>
  </div>

  <!-- 1. Part Price -->
  <div class="card">
    <h2><span class="method get">GET</span> /ws/part-price/:sku - Cmimi i pjeses</h2>
    <label>SKU i pjeses</label>
    <input type="text" id="sku-input" placeholder="p.sh. FRE-001" value="FRE-001"/>
    <button class="btn" onclick="getPrice()">Dergo kerkesen</button>
    <pre id="resp-price">// Pergjigja...</pre>
  </div>

  <!-- 2. Shipping Cost -->
  <div class="card">
    <h2><span class="method post">POST</span> /ws/shipping-cost - Kostoja e dergimit</h2>
    <label>Qyteti destinacion</label>
    <select id="ship-city" onchange="cityChange('ship')">
      <option value="">Zgjidh qytetin...</option>
    </select>
    <div class="form-row form-row-mt">
      <div>
        <label>Latitude</label>
        <input type="number" id="ship-lat" placeholder="40.4667" step="0.0001"/>
      </div>
      <div>
        <label>Longitude</label>
        <input type="number" id="ship-lon" placeholder="19.4833" step="0.0001"/>
      </div>
    </div>
    <button class="btn" onclick="getShipping()">Dergo kerkesen</button>
    <pre id="resp-ship">// Pergjigja...</pre>
  </div>

  <!-- 3. Full Quote -->
  <div class="card">
    <h2><span class="method post">POST</span> /ws/quote - Oferte e plote</h2>
    <label>Artikujt (SKU + sasia):</label>
    <div id="quote-items">
      <div class="quote-item">
        <input type="text" class="q-sku" placeholder="SKU" value="FIL-001"/>
        <input type="number" class="q-qty" placeholder="Sasia" value="2" min="1"/>
      </div>
    </div>
    <button class="btn btn-add btn-add-mt" onclick="addItem()">+ Shto artikull</button>
    <div class="form-row form-row-mt">
      <div>
        <label>Latitude</label>
        <input type="number" id="q-lat" placeholder="40.4667" step="0.0001"/>
      </div>
      <div>
        <label>Longitude</label>
        <input type="number" id="q-lon" placeholder="19.4833" step="0.0001"/>
      </div>
    </div>
    <button class="btn" onclick="getQuote()">Gjenero oferten</button>
    <pre id="resp-quote">// Pergjigja...</pre>
  </div>

</div>

<script>
const CITIES = {
    'Tirane':        { lat: 41.3275, lon: 19.8187 },
    'Durres':        { lat: 41.3246, lon: 19.4565 },
    'Vlore':         { lat: 40.4667, lon: 19.4833 },
    'Shkoder':       { lat: 42.0683, lon: 19.5126 },
    'Elbasan':       { lat: 41.1125, lon: 20.0822 },
    'Fier':          { lat: 40.7239, lon: 19.5567 },
    'Korce':         { lat: 40.6186, lon: 20.7808 },
    'Berat':         { lat: 40.7058, lon: 19.9522 },
    'Lushnje':       { lat: 40.9419, lon: 19.7047 },
    'Kavaje':        { lat: 41.1853, lon: 19.5564 },
    'Gjirokaster':   { lat: 40.0758, lon: 20.1394 },
    'Sarande':       { lat: 39.8747, lon: 20.0053 },
    'Pogradec':      { lat: 40.9022, lon: 20.6525 },
    'Kukes':         { lat: 42.0781, lon: 20.4156 },
    'Lezhe':         { lat: 41.7839, lon: 19.6436 },
    'Peshkopi':      { lat: 41.6847, lon: 20.4292 },
    'Burrel':        { lat: 41.6092, lon: 20.0114 },
    'Gramsh':        { lat: 40.8669, lon: 20.1853 },
    'Librazhd':      { lat: 41.1833, lon: 20.3167 },
    'Permet':        { lat: 40.2333, lon: 20.3500 },
    'Kruje':         { lat: 41.5094, lon: 19.7939 },
    'Lac':           { lat: 41.6333, lon: 19.7167 },
    'Rreshen':       { lat: 41.7672, lon: 19.9833 },
    'Bajram Curri':  { lat: 42.3583, lon: 20.0750 },
    'Krume':         { lat: 42.1939, lon: 20.4139 },
    'Bulqize':       { lat: 41.4944, lon: 20.2189 },
    'Cerrik':        { lat: 41.0333, lon: 20.0000 },
    'Peqin':         { lat: 41.0458, lon: 19.7497 },
    'Rrogozhine':    { lat: 41.0764, lon: 19.6667 },
    'Shijak':        { lat: 41.3458, lon: 19.5694 },
    'Tepelene':      { lat: 40.2956, lon: 20.0183 },
    'Corovode':      { lat: 40.5028, lon: 20.2272 },
    'Erseke':        { lat: 40.3378, lon: 20.6819 },
    'Bilisht':       { lat: 40.6272, lon: 20.9897 },
    'Ballsh':        { lat: 40.5997, lon: 19.7322 },
    'Roskovec':      { lat: 40.7344, lon: 19.6986 },
    'Patos':         { lat: 40.6833, lon: 19.6167 },
    'Delvine':       { lat: 39.9481, lon: 20.0958 },
    'Koplik':        { lat: 42.2167, lon: 19.4333 },
};

function cityChange(prefix) {
    const city = document.getElementById(prefix+'-city').value;
    const c = CITIES[city];
    if (c) {
        document.getElementById(prefix+'-lat').value = c.lat;
        document.getElementById(prefix+'-lon').value = c.lon;
        document.getElementById('q-lat').value = c.lat;
        document.getElementById('q-lon').value = c.lon;
    } else {
        document.getElementById(prefix+'-lat').value = '';
        document.getElementById(prefix+'-lon').value = '';
        document.getElementById('q-lat').value = '';
        document.getElementById('q-lon').value = '';
    }
}

const shipSel = document.getElementById('ship-city');
Object.keys(CITIES).forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c; shipSel.appendChild(o);
});

function key() { return document.getElementById('apikey').value.trim(); }

async function doLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;
    const msg      = document.getElementById('login-msg');
    try {
        const r = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const d = await r.json();
        if (!r.ok) { msg.style.color='#c0392b'; msg.textContent = d.error; return; }
        document.getElementById('apikey').value = d.token;
        msg.style.color = '#27ae60';
        msg.textContent = 'Token u mor! Tani mund te testosh endpoints.';
    } catch (e) {
        msg.style.color='#c0392b'; msg.textContent = 'Gabim: ' + e.message;
    }
}

function setStatus(el, ok, ms) {
    el.innerHTML = ok
        ? `<span class="badge-ok">200 OK</span> &nbsp; ${ms}ms`
        : `<span class="badge-err">Gabim</span>`;
}

async function getPrice() {
    const sku = document.getElementById('sku-input').value.trim();
    const t = Date.now();
    const r = await fetch(`/ws/part-price/${sku}`, { headers: { 'x-api-key': key() } });
    setStatus(document.getElementById('status-bar'), r.ok, Date.now()-t);
    document.getElementById('resp-price').textContent = JSON.stringify(await r.json(), null, 2);
}

async function getShipping() {
    const body = {
        dest_latitude:  parseFloat(document.getElementById('ship-lat').value),
        dest_longitude: parseFloat(document.getElementById('ship-lon').value),
        dest_city:      document.getElementById('ship-city').value
    };
    const t = Date.now();
    const r = await fetch('/ws/shipping-cost', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key() },
        body: JSON.stringify(body)
    });
    setStatus(document.getElementById('status-bar'), r.ok, Date.now()-t);
    document.getElementById('resp-ship').textContent = JSON.stringify(await r.json(), null, 2);
}

function addItem() {
    const d = document.createElement('div');
    d.className = 'quote-item';
    d.innerHTML = '<input type="text" class="q-sku" placeholder="SKU"/><input type="number" class="q-qty" value="1" min="1"/>';
    document.getElementById('quote-items').appendChild(d);
}

async function getQuote() {
    const items = [...document.querySelectorAll('.quote-item')].map(r => ({
        sku:      r.querySelector('.q-sku').value.trim(),
        quantity: parseInt(r.querySelector('.q-qty').value) || 1
    })).filter(i => i.sku);
    const body = {
        items,
        dest_latitude:  parseFloat(document.getElementById('q-lat').value),
        dest_longitude: parseFloat(document.getElementById('q-lon').value)
    };
    const t = Date.now();
    const r = await fetch('/ws/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key() },
        body: JSON.stringify(body)
    });
    setStatus(document.getElementById('status-bar'), r.ok, Date.now()-t);
    document.getElementById('resp-quote').textContent = JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
